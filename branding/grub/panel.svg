<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 456">
  <!-- The GRUB menu's glass card: tint, top-half gloss and a 1 px rim, like divineDE's tiles. -->
  <defs>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".14"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x=".5" y=".5" width="559" height="455" rx="30" fill="#171C30" fill-opacity=".55"/>
  <rect x=".5" y=".5" width="559" height="455" rx="30" fill="url(#gloss)" stroke="#fff" stroke-opacity=".28"/>
</svg>
