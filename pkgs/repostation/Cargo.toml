[package]
name = "repostation"
version = "0.1.0"
edition = "2024"
description = "divineOS app store for GitHub: search, build from source with native CPU flags, install, update"
license = "GPL-3.0-or-later"

[dependencies]
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
