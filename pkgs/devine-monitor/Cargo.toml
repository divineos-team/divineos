[package]
name = "devine-monitor"
version = "0.1.0"
edition = "2024"
description = "divineOS system monitor: CPU, memory, GPU, temperatures, network and processes, as a TUI or a JSON stream"
license = "GPL-3.0-or-later"

[dependencies]
nvml-wrapper = "0.13"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.40"

[profile.release]
lto = true
codegen-units = 1
strip = true
