  </defs>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg)"/>
  <rect x="8.5" y="8.5" width="111" height="111" rx="27.5" fill="url(#gloss)" stroke="#fff" stroke-opacity=".3"/>
  <circle cx="64" cy="64" r="36" fill="none" stroke="#fff" stroke-width="8"/>
  <path d="M80 48 70 70 48 80 58 58Z" fill="#fff"/>
