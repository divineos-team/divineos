# divineDE idle behaviour (hypridle). divine-shell draws the lock screen; this decides when.
general {
    lock_cmd = qs -p /usr/share/divine-shell ipc call lock lock
    before_sleep_cmd = loginctl lock-session   # lock before suspend, so the desktop never shows on wake
    ignore_dbus_inhibit = false                # video players and browsers can hold it off
}

listener {
    timeout = 300                              # 5 minutes
    on-timeout = loginctl lock-session
}
