# divineOS kernel tuning. Override in /etc/sysctl.d/.

# zram is the only swap: swapping to compressed RAM is cheaper than dropping page cache.
# Values from the Arch wiki zram section.
vm.swappiness = 180
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.page-cluster = 0

# Keep dentry/inode caches around longer; faster file trees, LSPs, builds.
vm.vfs_cache_pressure = 50
# Start background writeback early so large writes don't stall the desktop.
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864

# Editors, LSPs and file watchers need lots of inotify watches.
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024

# Network: BBR congestion control over fair queueing, TCP Fast Open both ways.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_mtu_probing = 1

# No NMI watchdog: one less periodic interrupt per CPU.
kernel.nmi_watchdog = 0
