# divineOS live boot menu (UEFI). Replaces releng's; archiso fills in the %…% placeholders, and
# build.sh copies divineos-base's GRUB theme into themes/divineos and adds "quiet splash".
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod all_video
insmod gfxterm
insmod gfxmenu
insmod png

set theme_dir=/boot/grub/themes/divineos
loadfont $theme_dir/inter-14.pf2
loadfont $theme_dir/inter-16.pf2
loadfont $theme_dir/inter-20.pf2
loadfont $theme_dir/inter-32.pf2
set gfxmode=auto
terminal_input console
terminal_output gfxterm
set theme=$theme_dir/theme.txt

set default=divineos
set timeout=10
set timeout_style=menu

menuentry "Try divineOS" --class divineos --id divineos {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "Try divineOS in a text console" --class terminal --id console {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% systemd.unit=multi-user.target
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "Boot from the next device" --class disk --id next {
    exit
}

if [ "${grub_platform}" = "efi" ]; then
    menuentry "Firmware settings" --class efi --id firmware {
        fwsetup
    }
fi

menuentry "Restart" --class restart --id restart {
    reboot
}

menuentry "Shut down" --class shutdown --id shutdown {
    halt
}
