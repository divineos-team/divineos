# divineOS live boot menu (BIOS), styled like the UEFI GRUB menu (iso/grub/grub.cfg). Replaces
# releng's. vesamenu draws text in 8x16 cells (80x30 at 640x480) over splash.png, which holds the
# glass panel, logo, name and key hint, so the frame and title are transparent. Moving rows or
# columns here means moving the panel in splash.svg.
SERIAL 0 115200
UI vesamenu.c32
MENU TITLE divineOS
MENU BACKGROUND splash.png
MENU WIDTH 80
MENU MARGIN 20
MENU ROWS 5
MENU VSHIFT 11
MENU TIMEOUTROW 12
MENU TABMSGROW 15
MENU CMDLINEROW 15
MENU TABMSG
MENU AUTOBOOT Starting in # s
MENU COLOR screen       37;40   #00000000 #00000000 none
MENU COLOR border       30;44   #00000000 #00000000 none
MENU COLOR title        1;36;44 #00000000 #00000000 none
MENU COLOR sel          7;37;40 #ffffffff #28ffffff none
MENU COLOR unsel        37;44   #ffc9d3e6 #00000000 none
MENU COLOR timeout_msg  37;40   #ffdde4f2 #00000000 none
MENU COLOR timeout      1;37;40 #ffdde4f2 #00000000 none
MENU COLOR cmdmark      1;36;40 #ff64d2ff #00000000 none
MENU COLOR cmdline      37;40   #ffffffff #00000000 none
MENU CLEAR
MENU IMMEDIATE
