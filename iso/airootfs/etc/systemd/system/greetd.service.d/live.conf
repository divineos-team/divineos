# Live ISO only: create the passwordless sudo user "live" (home from /etc/skel), then autologin.
[Service]
ExecStartPre=-/usr/bin/sh -c 'id live >/dev/null 2>&1 || { useradd -m -G wheel live; passwd -d live; echo "live ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/live; }'
ExecStart=
ExecStart=/usr/bin/greetd --config /etc/greetd/live.toml
